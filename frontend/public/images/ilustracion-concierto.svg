<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 660 540"
  role="img"
  aria-label="Smartphone mostrando un concierto con ticket EventPass"
>
  <defs>
    <linearGradient id="grad-phone-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="grad-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1145" />
      <stop offset="55%" stop-color="#0d0a24" />
      <stop offset="100%" stop-color="#080614" />
    </linearGradient>
    <linearGradient id="grad-ticket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="grad-stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <radialGradient id="glow-purple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0" />
    </radialGradient>
    <filter id="sombra-suave" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2e1065" flood-opacity="0.35" />
    </filter>
    <filter id="sombra-ticket" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-4" dy="10" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.45" />
    </filter>
    <clipPath id="clip-pantalla">
      <rect x="175" y="44" width="290" height="472" rx="34" />
    </clipPath>
    <g id="estrella">
      <path d="M0 -11 C1.4 -3.2 3.2 -1.4 11 0 C3.2 1.4 1.4 3.2 0 11 C-1.4 3.2 -3.2 1.4 -11 0 C-3.2 -1.4 -1.4 -3.2 0 -11 Z" />
    </g>
  </defs>

  <!-- Iluminación violeta general -->
  <circle cx="320" cy="300" r="300" fill="url(#glow-purple)" opacity="0.35" />

  <!-- Formas abstractas lavanda detrás del teléfono -->
  <g fill="#e9e0ff">
    <path d="M 60 330 q -10 -170 150 -185 q 160 -15 170 120 q 10 140 -120 150 q -130 10 -200 -85 Z" opacity="0.95" />
    <circle cx="580" cy="360" r="85" opacity="0.7" />
    <circle cx="560" cy="90" r="46" opacity="0.85" />
  </g>

  <!-- Anillos decorativos -->
  <circle cx="330" cy="290" r="125" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.55" />
  <circle cx="330" cy="290" r="180" fill="none" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="4 9" opacity="0.6" />

  <!-- Puntos decorativos -->
  <g fill="#c4b5fd">
    <circle cx="60" cy="115" r="4" />
    <circle cx="72" cy="225" r="3" />
    <circle cx="128" cy="430" r="4" />
    <circle cx="602" cy="205" r="4" />
    <circle cx="590" cy="455" r="3" />
    <circle cx="505" cy="55" r="3" />
    <circle cx="200" cy="60" r="3" />
  </g>

  <!-- Estrellas decorativas -->
  <use href="#estrella" transform="translate(95 150) scale(0.5)" fill="#a78bfa" opacity="0.8" />
  <use href="#estrella" transform="translate(585 165) scale(0.55)" fill="#f0abfc" opacity="0.8" />
  <use href="#estrella" transform="translate(565 485) scale(0.5)" fill="#a78bfa" opacity="0.7" />
  <use href="#estrella" transform="translate(65 465) scale(0.4)" fill="#f0abfc" opacity="0.7" />

  <!-- ══════════════════════ TELÉFONO ══════════════════════ -->
  <g transform="rotate(-6 320 290)" filter="url(#sombra-suave)">
    <!-- Botones laterales -->
    <rect x="158" y="120" width="5" height="42" rx="2.5" fill="#312e81" />
    <rect x="158" y="176" width="5" height="58" rx="2.5" fill="#312e81" />
    <rect x="477" y="160" width="5" height="72" rx="2.5" fill="#312e81" />

    <!-- Cuerpo -->
    <rect x="163" y="26" width="314" height="506" rx="48" fill="url(#grad-phone-body)" />
    <rect x="163" y="26" width="314" height="506" rx="48" fill="none" stroke="#a5b4fc" stroke-opacity="0.4" stroke-width="1.5" />

    <!-- Pantalla -->
    <rect x="175" y="44" width="290" height="472" rx="34" fill="url(#grad-screen)" />

    <g clip-path="url(#clip-pantalla)">
      <!-- Luces de concierto -->
      <circle cx="205" cy="215" r="200" fill="url(#glow-purple)" />
      <circle cx="425" cy="225" r="180" fill="url(#glow-blue)" />
      <circle cx="320" cy="140" r="150" fill="url(#glow-pink)" opacity="0.45" />

      <!-- Haces de luz hacia el escenario -->
      <g opacity="0.28">
        <polygon points="200,44 115,352 205,352" fill="#8b5cf6" />
        <polygon points="430,44 468,352 388,352" fill="#3b82f6" />
        <polygon points="320,44 258,352 382,352" fill="#a78bfa" opacity="0.75" />
        <polygon points="140,44 90,352 170,352" fill="#f0abfc" opacity="0.6" />
      </g>

      <!-- Confeti -->
      <g>
        <rect x="210" y="95" width="4" height="9" rx="1" fill="#f0abfc" opacity="0.7" transform="rotate(24 212 100)" />
        <rect x="262" y="70" width="4" height="9" rx="1" fill="#a78bfa" opacity="0.8" transform="rotate(-18 264 75)" />
        <rect x="330" y="88" width="4" height="9" rx="1" fill="#ffffff" opacity="0.55" transform="rotate(35 332 93)" />
        <rect x="395" y="62" width="4" height="9" rx="1" fill="#60a5fa" opacity="0.7" transform="rotate(-12 397 67)" />
        <circle cx="250" cy="120" r="3" fill="#f0abfc" opacity="0.6" />
        <circle cx="378" cy="112" r="3" fill="#ffffff" opacity="0.5" />
      </g>

      <!-- Escenario -->
      <rect x="175" y="332" width="290" height="16" fill="url(#grad-stage)" />
      <rect x="175" y="348" width="290" height="8" fill="#4c1d95" opacity="0.9" />

      <!-- Artista en el escenario -->
      <g fill="#0f172a">
        <circle cx="320" cy="264" r="13" />
        <path d="M320 278 c-11 28 -15 48 -17 62 h34 c-2 -14 -6 -34 -17 -62 z" />
      </g>
      <g fill="none" stroke="#0f172a" stroke-width="9" stroke-linecap="round">
        <path d="M305 292 q-20 -8 -26 -34 q18 -5 26 18" />
        <path d="M335 292 q20 -8 26 -34 q-18 -5 -26 18" />
      </g>
      <path d="M317 344 l6 -12" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
      <circle cx="323" cy="329" r="3.5" fill="#0f172a" />

      <!-- Público -->
      <g fill="#111827">
        <circle cx="200" cy="372" r="15" />
        <circle cx="232" cy="368" r="16" />
        <circle cx="266" cy="372" r="15" />
        <circle cx="298" cy="367" r="16" />
        <circle cx="330" cy="371" r="15" />
        <circle cx="362" cy="366" r="16" />
        <circle cx="396" cy="372" r="15" />
        <circle cx="428" cy="369" r="16" />
        <circle cx="456" cy="373" r="14" />
      </g>
      <g fill="#1e293b">
        <circle cx="184" cy="400" r="17" />
        <circle cx="220" cy="405" r="18" />
        <circle cx="258" cy="401" r="17" />
        <circle cx="294" cy="406" r="18" />
        <circle cx="330" cy="402" r="17" />
        <circle cx="366" cy="406" r="18" />
        <circle cx="402" cy="401" r="17" />
        <circle cx="438" cy="405" r="18" />
        <circle cx="470" cy="402" r="16" />
      </g>
      <rect x="175" y="416" width="290" height="100" fill="#0b0918" opacity="0.85" />

      <!-- Indicador LIVE -->
      <rect x="195" y="60" width="46" height="19" rx="9.5" fill="#ef4444" />
      <text x="218" y="74" font-family="'Inter', sans-serif" font-size="9.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">LIVE</text>

      <!-- Hora en barra de estado -->
      <text x="430" y="74" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#ffffff" opacity="0.9" text-anchor="end">20:30</text>

      <!-- Barra inferior de la pantalla -->
      <rect x="296" y="502" width="48" height="4" rx="2" fill="#ffffff" opacity="0.28" />
    </g>

    <!-- Cámara frontal -->
    <circle cx="320" cy="66" r="6" fill="#0b1020" />
    <circle cx="320" cy="66" r="2.4" fill="#ffffff" opacity="0.35" />
  </g>

  <!-- ══════════════════════ TICKET ══════════════════════ -->
  <g transform="rotate(13 470 380)" filter="url(#sombra-ticket)">
    <rect x="300" y="280" width="340" height="200" rx="26" fill="url(#grad-ticket)" />
    <rect x="300" y="280" width="340" height="200" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />

    <!-- Separación con perforaciones -->
    <path d="M470 280 v200" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="8 8" fill="none" />
    <circle cx="470" cy="280" r="14" fill="#ede9fe" />
    <circle cx="470" cy="480" r="14" fill="#ede9fe" />

    <!-- Sección izquierda: marca -->
    <use href="#estrella" transform="translate(388 336) scale(1.6)" fill="#ffffff" />
    <text x="388" y="388" font-family="'Inter', sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">EVENTPASS</text>
    <text x="388" y="412" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#e9d5ff" text-anchor="middle" letter-spacing="3">ADMIT ONE · CONCIERTO</text>
    <text x="388" y="436" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ddd6fe" text-anchor="middle" letter-spacing="2">VIE 20:00 · ESTADIO</text>
    <text x="316" y="462" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#ddd6fe" letter-spacing="1.5">ENTRADA GENERAL</text>

    <!-- Sección derecha: código de barras -->
    <rect x="480" y="296" width="150" height="168" rx="12" fill="#ffffff" />
    <g fill="#111827">
      <rect x="492" y="316" width="3" height="120" />
      <rect x="499" y="316" width="2" height="120" />
      <rect x="505" y="316" width="4" height="120" />
      <rect x="514" y="316" width="2" height="120" />
      <rect x="520" y="316" width="3" height="120" />
      <rect x="528" y="316" width="5" height="120" />
      <rect x="538" y="316" width="2" height="120" />
      <rect x="544" y="316" width="4" height="120" />
      <rect x="553" y="316" width="3" height="120" />
      <rect x="560" y="316" width="2" height="120" />
      <rect x="566" y="316" width="5" height="120" />
      <rect x="576" y="316" width="3" height="120" />
      <rect x="583" y="316" width="2" height="120" />
      <rect x="589" y="316" width="4" height="120" />
      <rect x="598" y="316" width="3" height="120" />
      <rect x="605" y="316" width="2" height="120" />
      <rect x="611" y="316" width="4" height="120" />
      <rect x="619" y="316" width="3" height="120" />
    </g>
    <text x="555" y="452" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#6b7280" text-anchor="middle" letter-spacing="2">N° 0147-8829</text>
  </g>
</svg>
